name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build
        run: ./gradlew :app:assembleDebug

      # The listing's privacy claims, as a build gate. Kept in a script so the
      # quoting lives in one place and can be run locally before pushing.
      - name: The privacy claims still hold
        run: ./scripts/check-privacy-claims.sh
