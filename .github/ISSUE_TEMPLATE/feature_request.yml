name: Feature request
description: Suggest something.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Two things Holdfast will not do, so nobody spends time writing them up:
        it will not gain an `INTERNET` permission, and it will not claim that a
        record is legally admissible. Anything that needs a server, an account
        or a sync belongs in a different app.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the feature. What are you recording, and who are you going to have to convince?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: offline
    attributes:
      label: Check before filing
      options:
        - label: This works with no network access at all
          required: true
